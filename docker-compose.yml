services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      Auth__RefreshCookie__Secure: ${COOKIE_SECURE:-true}
      # Set to true only when a reverse proxy in front of the app sets X-Forwarded-For/-Proto.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: ${BEHIND_PROXY:-false}
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Data Source=/data/loom.db"
      Database__MigrateOnStartup: "true"
      # Reminder push via Firebase Cloud Messaging: path to a mounted service-account JSON.
      # Blank leaves push off.
      Fcm__CredentialsPath: ${FCM_CREDENTIALS_PATH:-}
    volumes:
      - loom_data:/data
      # - ./firebase.json:/run/secrets/firebase.json:ro
    restart: unless-stopped

volumes:
  loom_data:
